workflows:
  felpfit-ios-unsigned:
    name: FelpFit iOS Build 152 Felmo Rich Notifications IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
          xcodebuild -project FelpFit.xcodeproj -scheme FelpFit -showBuildSettings | grep -E "PRODUCT_BUNDLE_IDENTIFIER|CURRENT_PROJECT_VERSION|MARKETING_VERSION|CODE_SIGN_ENTITLEMENTS"
          plutil -lint FelpFit/Info.plist
          plutil -lint FelpFit/FelpFit.entitlements
      - name: Build iPhone app without signing
        script: |
          xcodebuild \
            -project FelpFit.xcodeproj \
            -scheme FelpFit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package unsigned IPA
        script: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/FelpFit.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          ditto "$APP_PATH" build/ipa/Payload/FelpFit.app
          cd build/ipa
          /usr/bin/zip -qry ../FelpFit-unsigned.ipa Payload
      - name: Verify packaged capability build
        script: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/FelpFit.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "152"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "app.felpfit.ios"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP_PATH/Info.plist")" = "felpfit"
          test -f "FelpFit/FelpFit.entitlements"
          for reaction in happy proud worried hydration focused sleepy cheeky surprised; do
            test -n "$(find "$APP_PATH" -name "felmo-$reaction.png" -print -quit)"
          done
    artifacts:
      - build/FelpFit-unsigned.ipa
      - build/DerivedData/Build/Products/Release-iphoneos/FelpFit.app
      - FelpFit/FelpFit.entitlements
